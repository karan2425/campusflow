name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------- API + Prisma
  api:
    name: API · TypeScript + Prisma
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campusflow
          POSTGRES_PASSWORD: campusflow
          POSTGRES_DB: campusflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U campusflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://campusflow:campusflow@localhost:5432/campusflow_test?schema=public
      JWT_SECRET: ci-test-secret-key-that-is-long-enough-1234567890
      NODE_ENV: test
      SEED_DEFAULT_PASSWORD: Password@123
      AI_SERVICE_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Push schema to test database
        run: npx prisma db push --skip-generate --schema apps/api/prisma/schema.prisma

      - name: Typecheck
        run: npm --workspace @campusflow/api exec tsc --noEmit

      - name: Seed database
        run: npm --workspace @campusflow/api run db:seed

      - name: Run API test suite
        run: npm --workspace @campusflow/api test

  # --------------------------------------------------------------------- Web
  web:
    name: Web · Next.js build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm --workspace @campusflow/web exec tsc --noEmit

      - name: Unit tests
        run: npm --workspace @campusflow/web test -- --run

      - name: Production build
        run: npm --workspace @campusflow/web run build
        env:
          API_ORIGIN: http://localhost:4000
          NEXT_TELEMETRY_DISABLED: '1'

  # ---------------------------------------------------------------------- AI
  ai:
    name: AI · FastAPI + FAISS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai/requirements.txt

      - name: Install dependencies
        working-directory: apps/ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint imports (compile check)
        working-directory: apps/ai
        run: python -m compileall -q app

      - name: Run AI test suite
        working-directory: apps/ai
        run: python -m pytest tests/ -v
        env:
          GEMINI_API_KEY: ''   # exercises the deterministic fallback paths
          FAISS_INDEX_DIR: ./data/faiss

  # ------------------------------------------------------- Docker build check
  docker:
    name: Docker · images build
    runs-on: ubuntu-latest
    needs: [api, web, ai]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI image
        uses: docker/build-push-action@v6
        with:
          context: apps/ai
          file: apps/ai/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
